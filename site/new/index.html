<style>
:root{
  --bg:#fbfcfe; --rail:#ffffff; --panel:#ffffff; --panel2:#f1f5fa; --line:#dfe5ee; --line2:#c5cfdd;
  --text:#141a26; --muted:#55617a; --accent:#1a62d6; --accent-soft:#e7f0fd; --tab:#d6e6fc;
  --g:#2a7410; --a:#8f5400; --r:#c8162c; --b:#1a62d6;
  --ctl:#8a96ab; --tint:#e3e9f2; --tint2:#edf2f9; --tint3:#e9eff9; --hover:#f3f7fd; --on-accent:#fff; --edge:#c4c5d0; --aff-bg:#fde3e7; color-scheme:light;
  --rail-w:216px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:13px; color:var(--text);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:2px 5px;background:var(--panel)}
.muted{color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail-w) 1fr;height:100vh}
.shell.slim{--rail-w:56px}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:2px;min-width:0}

.rail a.app{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--muted);position:relative}
.rail a.app:hover{background:var(--panel);color:var(--text)}
.rail a.app[aria-current=page]{background:var(--accent-soft);color:var(--text)}
.rail a.app[aria-current=page]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail .lbl{white-space:nowrap;overflow:hidden;flex:1}
.rail .pip{min-width:30px;height:18px;border-radius:9px;background:var(--r);color:#1a0a0a;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.slim .lbl,.slim .brand span,.slim .foot .lbl{display:none}
.slim .pip{position:absolute;top:2px;right:2px;min-width:8px;height:8px;padding:0;font-size:0}
.rail .grow{flex:1}
.rail .foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.rail button.app{all:unset;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
.rail button.app:hover{background:var(--panel);color:var(--text)}
.rail button.app:focus-visible{outline:2px solid var(--accent)}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:600}


.body{flex:1;overflow:auto;padding:16px 20px 40px;min-height:0}

/* toolbar + filters */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.find{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--ctl);border-radius:8px;padding:6px 10px;min-width:260px;color:var(--muted)}
.find:focus-within{border-color:var(--accent)}
.find input{all:unset;flex:1;color:var(--text);min-width:0}
.btn{background:var(--panel);border:1px solid var(--ctl);border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line2)}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#120c2e;font-weight:600}
.count{background:var(--accent);color:#120c2e;border-radius:8px;padding:0 6px;font-size:12px;font-weight:700}
.count:empty{display:none}
select.sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--ctl);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;color:var(--muted)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--text)}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:0}
.chip{background:var(--accent-soft);border:1px solid rgba(140,123,255,.4);border-radius:14px;padding:3px 6px 3px 10px;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip.clear{background:none;border:none;color:var(--muted);padding:3px 6px;text-decoration:underline}
.split{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.split.nopanel{grid-template-columns:1fr}
.split.nopanel .facets{display:none}
.facets{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;position:sticky;top:0;max-height:calc(100vh - 260px);overflow:auto}
.fg{border-bottom:1px solid var(--line);padding:8px 0}
.fg:last-child{border:none}
.fg summary{cursor:pointer;font-weight:600;padding:2px 0 6px;list-style:none;display:flex;justify-content:space-between}
.fg summary::after{content:"▾";color:var(--muted)}
.fg:not([open]) summary::after{content:"▸"}
.fv{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.fv span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv em{font-style:normal;color:var(--muted);font-size:12px}
.fv input{accent-color:var(--accent)}

/* grid */
.gridwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th.num,td.num{text-align:right}
th[aria-sort=ascending]::after{content:" ↑";color:var(--accent)}
th[aria-sort=descending]::after{content:" ↓";color:var(--accent)}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.name{font-weight:500}
td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--muted)}
.t-g{--c:var(--g)}.t-a{--c:var(--a)}.t-r{--c:var(--r)}.t-b{--c:var(--b)}.t-n{--c:var(--muted)}
.dot.t-g,.dot.t-a,.dot.t-r,.dot.t-b,.dot.t-n{background:var(--c)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;color:color-mix(in srgb,var(--c) 74%,var(--text));background:color-mix(in srgb,var(--c) 15%,transparent)}
.bar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.hot i{background:var(--r)}
.star{background:none;border:none;font-size:15px;color:var(--muted);padding:0}
.star[aria-pressed=true]{color:var(--a)}
.empty{display:grid;place-items:center;text-align:center;padding:70px 20px;background:var(--panel);border:1px dashed var(--line2);border-radius:12px}
.empty h3{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--muted);max-width:46ch}
.none{padding:36px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.sbfill{flex:1}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:130px}
.kpi b{display:block;font-size:28px;font-weight:600;line-height:1.15;color:var(--c,var(--text))}
.kpi span{color:var(--muted)}

/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:block}
.tile:hover{border-color:var(--line2)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile b{display:block;font-size:28px;font-weight:600;line-height:1.15;color:var(--c,var(--text));margin:2px 0}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 0}
.card h2{font-size:14px;margin:0;padding:10px 16px}
/* one card style */
.ph-card,.qs-card,.fd-card,.tpl,.db-tile,.dt-left,.dt-right,.sx-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px}
.dt-right{padding:0}
.ph-card h3,.fd-card h3,.qs-card h2,.tpl h3,.dt-left h2{margin:0 0 10px;font-size:14px;font-weight:500}
.row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:hover{background:rgba(255,255,255,.03)}
.row .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}
.topo text{fill:var(--text);font-size:12px;text-anchor:middle}
.topo .node{cursor:pointer}
.topo .node:hover circle{stroke:var(--text)}
.topo line{stroke:var(--line2);stroke-width:1.4}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:10px 16px 16px}
.bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}

/* drawer + palette + toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line2);box-shadow:-20px 0 40px rgba(0,0,0,.35);padding:18px 20px;overflow:auto;z-index:30;transform:translateX(100%);transition:transform .18s ease}
.drawer.open{transform:none}
.drawer h2{margin:0 30px 14px 0;font-size:16px;word-break:break-word}
.drawer dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px}
.drawer dt{color:var(--muted)}.drawer dd{margin:0;word-break:break-word}
.drawer .x{position:absolute;top:12px;right:12px;background:none;border:none;font-size:20px;color:var(--muted)}
.drawer .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.55);z-index:40;display:none}
.scrim.open{display:block}
.pal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(680px,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:41;display:none;overflow:hidden}
.pal.open{display:block}
.pal .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal .in input{all:unset;flex:1;color:var(--text);font-size:15px}
.pal .pc{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pal .pc button{flex:none;background:none;border:1px solid var(--line);border-radius:14px;padding:3px 11px;color:var(--muted)}
.pal .pc button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.pal .res{max-height:48vh;overflow:auto;padding:6px 0}
.pal h4{margin:10px 16px 4px;font-size:12px;color:var(--muted);font-weight:600}
.pal .it{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer}
.pal .it[aria-selected=true]{background:var(--accent-soft)}
.pal .it .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal mark{background:none;color:var(--accent);font-weight:700}
.pal .ft{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.notes{line-height:1.5}
.notes h3{margin:16px 0 4px;font-size:13px}
.notes p,.notes li{color:var(--muted);margin:0 0 4px}
.notes ul{padding-left:18px;margin:0}

@media (max-width:900px){
  .shell{--rail-w:56px}
  .lbl,.brand span{display:none}
  .brand .bmark{display:block}
  .brand .bwide{display:none}
  #collapse svg{transform:scaleX(-1)}
  .split{grid-template-columns:1fr}
  .facets{position:static;max-height:300px}
  .gsearch kbd{display:none}
}
*,*::before,*::after{transition:none!important}

/* light theme + header + pickers */
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none;color:inherit;cursor:pointer}
.brand img,.brand .brandlogo{width:28px;height:28px;flex:none;display:block;color:var(--text)}
svg.i.fill{fill:currentColor;stroke:none}
.slim #collapse svg{transform:scaleX(-1)}
.brand .bmark{display:none}
.brand .bwide{display:block;min-width:0}
.brandwide{display:block;height:22px;width:auto;max-width:100%}
.brandwide .wm{fill:var(--text)}
.brandwide.bb{height:27px;margin:-2px 0}
.slim .brand .bmark{display:block}
.slim .brand .bwide{display:none}
.rail .pip{color:#fff}
.count,.btn.primary{color:var(--on-accent)}
.scrim{background:rgba(30,30,50,.35)}
.toast{background:var(--text);color:var(--panel);border-color:var(--text)}
.drawer{box-shadow:-12px 0 32px rgba(30,30,50,.16)}
.pal{box-shadow:0 24px 70px rgba(30,30,50,.25)}
.card,.tile,.gridwrap,.facets,.empty,.kpi,.topo{border-radius:8px}
.fg summary{background:var(--tint2);border-radius:6px;padding:6px 8px;margin-bottom:4px}
tbody tr:hover{background:var(--hover)}
.apphead{display:flex;align-items:center;gap:14px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.appid{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.appid svg{color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.tabs a{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;white-space:nowrap}
.tabs a:hover{background:var(--panel2)}
.tabs a[aria-selected=true]{background:var(--tab);font-weight:500}
.tabs[hidden]{display:none}
.tabs .n{font-size:12px;font-weight:700;border-radius:9px;padding:1px 7px;background:var(--tint);color:var(--muted)}
.tabs .n.r{background:var(--r);color:#fff}
.tabs .n.sq{border-radius:3px}
.tabs .n.a{background:color-mix(in srgb,var(--a) 22%,var(--panel));color:var(--a)}
.gsearch{width:300px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;color:var(--muted);text-align:left}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- mock data ---------- */
let _s=42; const rnd=()=>(_s=_s*16807%2147483647)/2147483647;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const wpick=(a,w)=>{let t=rnd()*w.reduce((x,y)=>x+y,0);for(let i=0;i<a.length;i++){t-=w[i];if(t<0)return a[i]}return a[a.length-1]};
const mk=(n,f)=>Array.from({length:n},(_,i)=>f(i));
const pad=n=>String(n).padStart(2,'0');
const SEGS=['prod-eu','prod-us','staging'];

const SVC=['checkout','cart','catalog','payment','search','recommendation','inventory','shipping','notification','auth','user-profile','pricing','email','fraud-check','order','review','session','gateway','billing','analytics','ledger','media','loyalty','returns'];
const hex=n=>mk(n,()=>Math.floor(rnd()*16).toString(16)).join('');
const fmtAgo=m=>m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`;
const clock=(t)=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`};

const ent=(name,type,x={})=>({name,type,health:wpick(HEALTH,HW),cpu:ri(4,96),mem:ri(10,92),cloud:pick(['AWS','Azure','GCP','On-prem']),os:pick(['Linux','Linux','Windows']),seg:pick(SEGS),...x});
const HOSTS=[
  ...mk(14,i=>ent(`${pick(['web','api','db','cache','worker','queue'])}-${pick(['eu','us','ap'])}-${pad(i+1)}`,'Host')),
  ...['java checkout-svc','nginx','postgres 15','redis-server','node app.js','envoy','kafka broker','python worker'].map(n=>ent(n,'Process')),
  ...mk(8,i=>ent(`${pick(SVC)}-${hex(5)}`,'Container')),
  ...['sw-core-01','sw-core-02','f5-bigip-01','rtr-edge-01','rtr-edge-02','fw-dmz-01'].map(n=>ent(n,'Network device',{os:'n/a',cloud:'On-prem'})),
  ...['/dev/nvme0n1','/dev/nvme1n1','/dev/sda1','/dev/sdb1'].map(n=>ent(n,'Disk',{os:'Linux'}))
];
const HOSTS_ONLY=HOSTS.filter(r=>r.type!=='Network device');

const NETDEV=(()=>{const devs=['sw-core-01','sw-core-02','sw-dist-01','sw-dist-02','rtr-edge-01','rtr-edge-02','rtr-wan-01','fw-dmz-01','fw-dmz-02','f5-bigip-01','f5-bigip-02','sw-branch-01'];

  const rows=devs.map(n=>({name:n,type:kind(n),health:wpick(HEALTH,[8,2,1]),vendor:n.startsWith('f5')?'F5':n.startsWith('fw')?'Fortinet':pick(NET_VENDOR),traffic:ri(40,9000),util:ri(5,96),errors:ri(0,40),site:site(),seg:pick(SEGS)}));
  mk(24,i=>{const d=devs[i%devs.length];rows.push({name:`${d}:Gi0/${Math.floor(i/devs.length)+i%4}`,type:'Interface',health:wpick(HEALTH,[10,2,1]),vendor:'-',traffic:ri(1,1000),util:ri(2,99),errors:ri(0,200),site:site(),seg:pick(SEGS)})});

].map(x=>{const h=wpick(HEALTH,HW);return{...x,health:h,fail:+(h==='Critical'?ri(8,30):h==='Warning'?ri(2,8):rnd()*1.5).toFixed(1),p50:ri(8,420),tput:ri(20,9000),seg:pick(SEGS)}});
SVC.slice(12).forEach((n,i)=>{const h=k=>{const x=Math.sin((i+1)*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};const hl=h(1)<.7?'Healthy':h(1)<.88?'Warning':'Critical';SERVICES.splice(12+i,0,{name:n,type:'Service',tech:['Java','Node.js','.NET','Python','Go'][Math.floor(h(2)*5)],health:hl,fail:+(hl==='Critical'?8+h(3)*20:hl==='Warning'?2+h(3)*5:h(3)*1.5).toFixed(1),p50:Math.round(8+h(4)*400),tput:Math.round(20+h(5)*8000),seg:SEGS[Math.floor(h(6)*SEGS.length)]})});

let _mi=0;
const SYNTH=mk(28,()=>{const type=wpick(['Browser','HTTP','NAM'],[3,5,3]);const st=wpick(['Healthy','Failing','Disabled'],[8,2,2]);
  return{name:`${pick(['Login','Checkout flow','Homepage','Search','API health','Cart','Payment','Docs'])} ${pad(++_mi)}`,type,status:st,avail:st==='Failing'?+(rnd()*40+50).toFixed(1):+(97+rnd()*3).toFixed(1),dur:ri(120,5200),freq:pick(['1 min','5 min','15 min','1 h']),loc:pick(['Frankfurt','Virginia','Singapore','Private: DC1']),seg:pick(SEGS)}});

  .map(x=>({...x,rum:rnd()<.8?'Enabled':'Disabled',apdex:+(.55+rnd()*.44).toFixed(2),load:ri(600,4800),actions:ri(0,90000),seg:pick(SEGS)}));

const USESS=mk(60,()=>{const fe=pick(FRONT),dur=ri(8,1800),errs=wpick([0,1,2,5],[8,3,2,1]),act=ri(1,70);
  return{name:`s-${hex(8)}`,user:pick(['anonymous','anonymous','anna.k','jonas.m','priya.s','tom.r','lukas.b']),frontend:fe.name,country:pick(['Austria','Germany','United States','Brazil','India','Japan','France']),device:fe.kind==='Mobile'?pick(['iOS','Android']):pick(['Chrome','Safari','Firefox','Edge']),dur,actions:act,errors:errs,sat:errs>=5||(dur<15&&act<3)?'Frustrated':errs>=1?'Tolerating':'Satisfied',started:Math.floor(rnd()**2*1500),seg:pick(SEGS)}});
const AI_APPS=['support-assistant','sales-copilot','code-reviewer','search-agent','onboarding-bot'];
const AI_MODELS=['claude-sonnet-5-5','claude-opus-5-5','claude-haiku-4-5','gpt-4.1','gemini-2.5-pro'];
const AI_FLAGS=['None','None','None','None','None','Hallucination','PII leak','Toxicity','Prompt injection','Refusal'];
const AICONV=mk(60,()=>{const app=pick(AI_APPS),model=pick(AI_MODELS),flag=pick(AI_FLAGS),g=Math.max(18,Math.min(99,ri(52,99)-(flag==='Hallucination'?30:0))),rel=Math.max(20,Math.min(99,ri(55,99)-(flag==='Refusal'?25:0)));
  const q=g>=80&&rel>=80&&flag==='None'?'Good':(g<60||rel<60||['Hallucination','PII leak','Toxicity'].includes(flag))?'Poor':'Needs review';
  return{name:`chat-${hex(6)}`,user:`user-${ri(1000,9999)}`,app,model,turns:ri(2,14),tokens:ri(900,22000),latency:ri(600,9000),cost:+(ri(2,260)/1000).toFixed(3),grounded:g,relevance:rel,quality:q,flag,feedback:wpick(['Positive','Negative','None'],[3,1,6]),started:Math.floor(rnd()**2*1500),seg:pick(SEGS)}});
const AUD_USERS=['anna.k','jonas.m','priya.s','tom.r','lukas.b','eva.l','svc-ci','svc-backup'];
const AUD_ACTS=[['Login','Web UI','Low'],['Login','API','Low'],['Role changed','user account','High'],['API token created','ci-deploy','Medium'],['API token created','grafana-sync','Medium'],['Dashboard shared','Checkout KPIs','Low'],['Setting changed','Alerting profiles','Medium'],['Setting changed','Log retention','Medium'],['Data export','Logs bucket','High'],['User invited','new colleague','Low'],['Segment edited','prod-eu','Medium'],['Workflow executed','Restart failed pods','Low']];
const USERAUD=mk(80,()=>{const [action,res,base]=pick(AUD_ACTS),user=pick(AUD_USERS),svc=user.startsWith('svc-'),result=wpick(['Success','Failed','Denied'],[action==='Login'?7:12,action==='Login'?3:1,1]),risk=result==='Failed'&&action==='Login'?'Medium':result==='Denied'?'High':base;
  return{ago:Math.floor(rnd()**2*1500),user,action,name:`${action}: ${res==='user account'?pick(AUD_USERS.filter(u=>!u.startsWith('svc-'))):res}`,result,risk,method:svc?'API':action==='Login'?res:pick(['UI','UI','API','CLI']),ip:`${pick([10,84,91,185,203])}.${ri(0,255)}.${ri(0,255)}.${ri(1,254)}`,loc:pick(['Austria','Austria','Germany','United States','Brazil','India','Japan'])}});
const lgh=str=>{let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);h=h||1;return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}};
const lr=(g,a,b)=>a+Math.floor(g()*(b-a+1));
const LOGMSG={
 INFO:[g=>`Request completed in ${lr(g,6,420)} ms (status 200)`,g=>`User session created for ${['anna.k','ben.s','carla.m','dev.t'][lr(g,0,3)]}`,()=>'Health check OK',g=>`Config reloaded (version ${lr(g,12,48)})`,g=>`Order ${lr(g,10000,99999)} placed, total ${lr(g,12,480)}.${lr(g,10,99)} EUR`,g=>`Scheduled job inventory-sync finished in ${lr(g,2,40)} s`,g=>`Cache refreshed, ${lr(g,200,9000)} entries`],
 WARN:[g=>`Slow query detected: ${lr(g,800,4200)} ms on orders`,()=>'Retrying upstream call (attempt 2 of 3)',g=>`Cache miss ratio ${lr(g,35,70)}% is above the threshold`,g=>`Connection pool at ${lr(g,85,98)}% of capacity`,g=>`Deprecated API /v1/cart called by client ${['ios-4.2','web-3.9','partner-api'][lr(g,0,2)]}`],
 ERROR:[()=>'Payment gateway timeout after 3000 ms',g=>`Unhandled exception in handler: NullPointerException at OrderService.java:${lr(g,40,420)}`,()=>'Connection pool exhausted, 0 of 50 connections available',()=>'Upstream inventory returned HTTP 503',()=>'Failed to publish event order.placed: TimeoutException'],
 DEBUG:[g=>`Cache lookup key=sku:${lr(g,1000,9999)} hit`,()=>'Resolved feature flag new-checkout-flow=true',()=>'Entering handler OrderController.create',g=>`SQL executed in ${lr(g,1,40)} ms`]
};

const TRACES=mk(40,()=>({ago:Math.floor(rnd()**2*1500),name:pick(ENDPOINTS),id:hex(12),service:pick(SVC),dur:ri(8,3200),spans:ri(3,64),status:wpick(['OK','Error'],[8,2]),seg:pick(SEGS)}));

     (rate?`<polyline class="exln" fill="none" points="${rate.map((v,i)=>`${(ml+i*bw+bw/2).toFixed(1)},${YR(v).toFixed(1)}`).join(' ')}"/>`:'');
  }else{

      body=`<g class="exax">${yAxis(mx,xn)}${(W<520?[0,2,4]:[0,1,2,3,4]).map(k=>{const v=log?Math.pow(10,t0+(t1-t0)*k/4):t0+(t1-t0)*k/4;return `<text x="${ml+pw*k/4}" y="${H-4}" text-anchor="${k?k<4?'middle':'end':'start'}">${esc(fmt(v))}</text>`}).join('')}</g>`+
       okc.map((v,i)=>`<g><title>${okc[i]+bdc[i]} ${esc(hc.noun||'items')}</title><rect class="exo" x="${(ml+i*bw+1).toFixed(1)}" y="${Y(v+bdc[i]).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(ph*v/mx).toFixed(1)}"/><rect class="exb" x="${(ml+i*bw+1).toFixed(1)}" y="${Y(bdc[i]).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(ph*bdc[i]/mx).toFixed(1)}"/></g>`).join('')+mk(med,'p50',0)+mk(avg,'avg',Math.abs(X(med)-X(avg))<32?14:0);

function exAction(a){

function exClick(T,e){

  const fa=T.closest('[data-fka]');if(fa){if(fa.disabled)return true;const [a,k]=fa.dataset.fka.split('|');$('#exfloat').hidden=true;if(a==='clear'){delete s.f[k];delete s.rng[k]}else s.fhid.add(k);updateAll();return true}
  if(T.closest('#fsettings')){s.fhid.clear();s.fsearch='';$('#fs').value='';exFacets();return true}
  const cr=T.closest('[data-crng]');if(cr){delete s.rng[cr.dataset.crng];updateAll();return true}

  if(T.closest('[data-excolreset]')){s.cols=null;drawColMenu();updateGrid();return true}
  return false;
}

const ASSIST_SUGG=['Summarize open problems','Find the likely root cause of the top problem','Which services fail the most?','How are my SLOs doing?','Draft a postmortem outline'];
let assistOpen=false,assistMode='dock';try{assistMode=localStorage.getItem('dtproto_assist_mode')||'dock'}catch(e){}
const effMode=()=>innerWidth<1000?'overlay':assistMode;
const DOCK_ICO='<svg class="i" viewBox="0 0 20 20" style="width:16px;height:16px"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M12 4v12"/></svg>';

function applyAssistMode(){
  const m=effMode();
  $('#shell').classList.toggle('assist-dock',assistOpen&&m==='dock');
  document.body.classList.toggle('assist-docked',assistOpen&&m==='dock');
  $('#assist').classList.toggle('overlay',m==='overlay');
  const b=$('#amode');if(b){b.innerHTML=m==='dock'?FLOAT_ICO:DOCK_ICO;const t=m==='dock'?'Float over the page':'Dock to the side and push the page';b.title=t;b.setAttribute('aria-label',t)}
}
window.addEventListener('resize',()=>{if(assistOpen)applyAssistMode()});
matchMedia('(max-width:700px)').addEventListener('change',()=>{if(cur){render();if(assistOpen)applyAssistMode()}});
function openAssist(){
  closeRecents();closeDrawer();assistOpen=true;$('#assist').hidden=false;applyAssistMode();
  $('#actx').textContent=actxText();
  if(!$('#amsgs').children.length)assistMsg('bot','Hi, I can answer questions about the data in this prototype. Pick a suggestion or ask your own.');
  $('#ain').focus();
}
function closeAssist(){assistOpen=false;$('#assist').hidden=true;applyAssistMode()}
function assistMsg(role,text,actions=[]){
  const d=document.createElement('div');d.className='am '+role;
  d.innerHTML=`<p>${esc(text).replace(/\n/g,'<br>')}</p>`+(actions.length?`<div class="aact">${actions.map(a=>`<button class="btn" data-aa="${esc(JSON.stringify(a))}">${esc(a.label)}</button>`).join('')}</div>`:'');
  $('#amsgs').append(d);$('#amsgs').scrollTop=1e9;
}
function assistAnswer(q){
  const t=q.toLowerCase(),open=PROB.filter(p=>p.status==='Open'&&segOK(p)).sort((a,b)=>a.started-b.started);
  if(/root|cause/.test(t)&&open[0]){const p=open[0],ex=explainBuild(p).t;return{text:`Top problem: ${p.id}, ${p.name} on ${p.entity}, started ${fmtAgo(p.started)}. ${ex.cause}. ${ex.why}`,actions:[{label:'Open problem graph',app:'smartscape',tab:'problem',sel:p.id},{label:'Show logs',app:'telemetry',tab:'logs',q:p.entity,f:{}}]}}
  if(/summar|problem|open/.test(t)){const c={};open.forEach(p=>{c[p.category]=(c[p.category]||0)+1});return{text:`${open.length} open problems across ${new Set(open.map(p=>p.entity)).size} entities.\n`+Object.entries(c).map(([k,n])=>`• ${k}: ${n}`).join('\n'),actions:[{label:'Show open problems',app:'issues',tab:'problems',f:{status:['Open']}}]}}
  if(/service|fail/.test(t)){const top=SERVICES.filter(s=>s.type==='Service'&&segOK(s)).sort((a,b)=>b.fail-a.fail).slice(0,3);return{text:'Highest failure rate:\n'+top.map(s=>`• ${s.name}: ${s.fail}% (${s.health})`).join('\n'),actions:[{label:'Open errors',app:'applications',tab:'errors',f:{}}]}}
  if(/slo|budget/.test(t))return{text:[...SLOS].sort((a,b)=>a.budget-b.budget).slice(0,3).map(s=>`• ${s.name}: ${s.cur}% against a ${s.target}% target, ${s.budget<0?'error budget used up':s.budget+'% budget left'}, burn rate ${s.burn}×`).join('\n'),actions:[{label:'Open SLOs',app:'applications',tab:'slos',f:{}},{label:'Open guardians',app:'automate',tab:'guardians',f:{}}]};
  if(/postmortem|draft/.test(t))return{text:'Postmortem outline:\n1. Summary and impact\n2. Timeline: detection, triage, fix\n3. Root cause\n4. What went well and what did not\n5. Follow-up actions with owners',actions:[{label:'Find postmortem template',app:'documents',tab:'pages',q:'postmortem',f:{}}]};
  return{text:'In this prototype I can summarize problems, find a likely root cause, rank failing services, report SLO status and draft a postmortem outline.',actions:[]};
}
function assistAsk(text){
  text=text.trim();if(!text)return;
  assistMsg('user',text);
  if(text==='Ask something else'){assistCtx=null;setAssistChips(ASSIST_SUGG);$('#actx').textContent=actxText();assistMsg('bot','Sure. What would you like to know?');return}
  let a=null;
  if(assistCtx){const r=xpAnswer(text);if(r&&!/^I can /.test(r))a={text:r,actions:[]}}
  if(!a)a=assistAnswer(text);
  assistMsg('bot',a.text,a.actions);
}

function qsChart(kind){
  const {to,from}=tfRange();

  const xl=[0,1,2].map(i=>`<text x="${L+pw*(i*.5)}" y="${H-5}" text-anchor="${i===2?'end':i===0?'start':'middle'}" font-size="11" fill="var(--muted)">${qsClock(from-(from-to)*i/2)}</text>`).join('');
  let body='';

  if(kind==='r'){const line=(base,amp,c,s)=>`<polyline fill="none" stroke="${c}" stroke-width="1.6" points="${Array.from({length:30},(_,i)=>`${xs(i).toFixed(1)},${(6+(1-(base+hr(i,s)*amp))*ph).toFixed(1)}`).join(' ')}"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${kind==='t'?'Throughput':kind==='r'?'Response time':'Failure rate'} over the selected timeframe">${body}${xl}</svg>`;

const dur=m=>m<60?`${Math.round(m)}m`:m<1440?`${+(m/60).toFixed(1)}h`:`${+(m/1440).toFixed(1)}d`;
const dqlWindow=()=>{const {to,from}=tfRange();return to?`from:now()-${dur(from)}, to:now()-${dur(to)}`:`from:now()-${dur(from)}`};
const up=v=>String(v).toUpperCase().replace(/ /g,'_');
const lo=v=>String(v).toLowerCase();
const bool=v=>v==='Enabled'||v==='Error'?'true':'false';
const Q=(src,o={})=>({src,...o});
const DOCS_SCOPE={Mine:'owner == "me"','Shared with me':'isShared == true','Ready-made':'isPreset == true',Favorites:'isFavorite == true',Trash:'isDeleted == true'};
const docQ=type=>Q(`fetch dt.system.documents`,{pre:[`type == "${type}"`],scopeMap:DOCS_SCOPE,def:'isDeleted == false',map:{},search:'name',tail:['fields id, name, owner, modificationInfo.lastModifiedTime','sort modificationInfo.lastModifiedTime desc','limit 100']});

const segApplies=()=>G.seg!=='all'&&cur.app.scoped!==false&&cur.tab.scoped!==false&&!cur.tab.noSeg;
const hasDql=()=>{const a=cur.app.id,t=cur.tab.id;return a==='smartscape'?!!(SSDQL[t]||t==='problem'||t==='around'):!!DQL[`${a}/${t}`]};
function dqlFor(){
  const a=cur.app.id,t=cur.tab.id;
  dqlMeta={out:'table',live:false};
  if(a==='smartscape'){
    if(t==='problem'){const p=PROB.find(x=>x.id===probSel);return `fetch dt.davis.problems\n| filter display_id == "${p?p.id:'P-2400'}"\n| fields display_id, event.name, root_cause_entity_id, affected_entity_ids\n| expand affected_entity_ids\n| lookup [smartscapeNodes "*"], sourceField:affected_entity_ids, lookupField:id, fields:{name, type}`}
    if(t==='around')return aroundDql();
    return SSDQL[t]||null;
  }
  const c=DQL[`${a}/${t}`]; if(!c)return null;
  const s=ui&&ui.tab===cur.tab?ui.s:null;
  const cfg=Array.isArray(c)?c[(s&&s.mode)||0]:c;
  dqlMeta={out:cfg.out||'table',live:!!cfg.live};
  const WIN=dqlWindow();
  let src=cfg.src.replace('${WIN}',WIN);
  if(cfg.liveSrc&&s&&s.live){src=cfg.liveSrc;dqlMeta.live=true}
  const def=ui&&ui.tab===cur.tab?ui.def:cur.tab;
  const lines=[];
  if(s&&cfg.srcBy){const set=s.f[cfg.srcBy.k];if(set&&set.size===1){const v=[...set][0];if(cfg.srcBy.m[v])src=`smartscapeNodes "${cfg.srcBy.m[v]}"`}}
  (cfg.pre||[]).forEach(x=>lines.push(`filter ${x}`));
  if(s){
    Object.entries(s.f).forEach(([k,set])=>{if(!set.size)return;const m=(cfg.map||{})[k];const fld=m?m[0]:k,tr=m?m[1]:(v=>v);const vals=[...set].map(v=>{const o=tr(v);return o==='true'||o==='false'?o:`"${o}"`});
      lines.push(vals.length===1?`filter ${fld} == ${vals[0]}`:`filter in(${fld}, ${vals.join(', ')})`)});
    if(s.q.trim())lines.push(`filter contains(${cfg.search||'name'}, "${s.q.trim().replace(/"/g,'\\"')}", caseSensitive:false)`);
    if(cfg.scopeMap){const sc=cfg.scopeMap[s.scope];lines.push(`filter ${sc||cfg.def}`)}
  }
  (cfg.tail||[]).forEach(x=>lines.push(x));
  return [src,...lines.map(l=>'| '+l)].join('\n');
}
const KW=/\b(fetch|filter|fields|fieldsAdd|summarize|sort|limit|timeseries|makeTimeseries|smartscapeNodes|smartscapeEdges|traverse|expand|dedup|lookup|from|to|by|in|and|or|asc|desc|interval|rate|direction|sourceField|lookupField|caseSensitive|else|if)\b/g;
function hiDql(src){
  return esc(src).split(/(&quot;.*?&quot;)/).map((p,i)=>i%2?`<span class="str">${p}</span>`:p.replace(KW,'<b class="kw">$1</b>').replace(/\b(\d+[smhd])\b/g,'<i class="num">$1</i>')).join('');
}
let dqlView='dql';
function dtctlCmd(q){
  const flat=q.replace(/\n\| /g,' | ').replace(/\n/g,' ');
  return `dtctl query '${flat.replace(/'/g,"'\\''")}' -o ${dqlMeta.out}${dqlMeta.live?' --live --interval 5s':''}${segApplies()?` --segment ${G.seg}`:''}`;
}
function drawDql(){

}
function copyText(t,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done);
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}

function codeKind(r){

  if(key==='applications/slos')return'slo';

function codeText(k,r,v){
  const name=r.name,s=cbSlug(name),tf=s.replace(/-/g,'_'),id=cbId(name),tpl=cur.tab.id==='templates',AUTH='  -H "Authorization: Bearer $DT_TOKEN"';

  if(v==='dtctl')return tpl?`# Create it from this template. --set fills the template values.\ndtctl apply -f ${s}.yaml --set env=prod\n\n# Preview the change first\ndtctl diff -f ${s}.yaml`
    :`# Export, review the change, then apply it\ndtctl get ${res[0]} "${name}" -o yaml > ${s}.yaml\ndtctl diff -f ${s}.yaml\ndtctl apply -f ${s}.yaml`+(k==='workflow'?`\n\n# Follow its runs\ndtctl get workflows --watch`:'');
  if(v==='api'){

  }
  if(v==='tf'){
    if(k==='workflow')return `resource "dynatrace_automation_workflow" "${tf}" {\n  title       = "${name}"\n  description = "Managed by Terraform"\n  trigger {\n    # ${tpl?'Trigger from the template':`${r.trigger} trigger`}\n  }\n  tasks {\n    # ${tpl?r.content:'Tasks exported from the workflow'}\n  }\n}`;

    if(k==='detector')return `resource "dynatrace_davis_anomaly_detectors" "${tf}" {\n  title       = "${name}"\n  description = "${r.applies}: ${r.content}"\n  enabled     = true\n  source      = "Terraform"\n  analyzer {\n    name = "dt.statistics.ui.anomaly_detection.StaticThresholdAnomalyDetectionAnalyzer"\n    # input: query, threshold, alert condition\n  }\n  event_template {\n    # event.name, event.type, dt.source_entity\n  }\n  execution_settings {\n    # actor, query_offset\n  }\n}`;
    return `resource "dynatrace_document" "${tf}" {\n  type    = "dashboard"\n  name    = "${name}"\n  content = file("\${path.module}/${s}.json")\n}`;
  }
  const type={workflow:'type:\n      automation:\n        resource: workflow',slo:'type: slo-v2',detector:'type:\n      settings:\n        schema: builtin:davis.anomaly-detectors\n        scope: environment',dashboard:'type:\n      document:\n        kind: dashboard'}[k];
  return `# Deploy with: monaco deploy manifest.yaml\nconfigs:\n  - id: ${s}\n    ${type}\n    config:\n      name: ${name}\n      template: ${s}.json`;
}

  const base=Date.now()-f.mod*60000,acts=['Updated targeting','Changed rollout','Updated summary','Associated variable','Changed status'],a=[];
  for(let i=0;i<4;i++){const prod=f.status!=='Development'&&flh(f.key.length+i,9)>.4;a.push({who:FL_PEOPLE[Math.floor(flh(f.key.length+i,10)*FL_PEOPLE.length)],what:acts[Math.floor(flh(f.key.length+i,11)*acts.length)],env:prod?'Production':'Development',at:base-i*Math.floor(3600000*(2+flh(i,f.key.length)*60))})}
  a.push({who:f.creator,what:'Created feature',env:'',at:base-86400000*(5+Math.floor(flh(f.key.length,12)*60))});
  return f.audit=a;
}
function flagTouch(f,what,env){f.audit=[{who:'You',what,env:env||'',at:Date.now()},...flagAudit(f)];f.at=Date.now();f.mod=0;f.dirty=true;f.env=flagEnvTxt(f);saveFlags()}
function flagMd(t){
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  let out='',list=false;
  t.split('\n').forEach(l=>{
    if(/^- /.test(l)){if(!list){out+='<ul>';list=true}out+=`<li>${inl(l.slice(2))}</li>`;return}
    if(list){out+='</ul>';list=false}
    if(/^## /.test(l))out+=`<h4>${inl(l.slice(3))}</h4>`;else if(l.trim())out+=`<p>${inl(l)}</p>`});
  return out+(list?'</ul>':'');
}

function flagSeries(f,env,days){
  const envs=env==='All environments'?f.envs.filter(e=>e.on):f.envs.filter(e=>e.n===env&&e.on);
  const share=envs.reduce((a,e)=>a+(e.n==='Production'?1:.12)*(e.pct/100+.25),0)/(env==='All environments'?1.4:1);
  const base=Math.max(f.evals,0)*Math.min(1,share||0)/Math.max(days,1)/Math.max(1,env==='All environments'?1:1);
  return Array.from({length:days},(_,i)=>Math.round(base*(.55+flh(i,f.key.length)*.9)*(1+i/days*.25)));
}
