name: Deploy

# PRs get a validation check. Merging to main runs the deploy job, which
# pauses for manual approval (the `production` environment) before uploading
# the site to world4you over FTPS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate mantras.json parses
        run: python3 -c "import json; json.load(open('site/mantras.json'))"

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reducetothemax.com
    steps:
      - uses: actions/checkout@v7
      - name: Upload site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Trailing slash is required. Target the /rttm folder on the FTP server.
          local-dir: ./site/
          server-dir: /rttm/
